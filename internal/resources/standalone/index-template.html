<html>
  <head>
    <title>{{ if not (eq .PageTitle "") }}{{ .PageTitle }} - {{ end }}gRPC UI</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <script src="jquery-3.4.1.min.js"></script>

    <link rel="stylesheet" href="jquery-ui-1.12.1.min.css">
    <script src="jquery-ui-1.12.1.min.js"></script>

    <link rel="stylesheet" href="grpc-web-form.css">
    <script src="grpc-web-form.js"></script>

    <style>
    * {
      box-sizing: border-box;
    }

    :after, :before {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 20px;
      color: #333;
      display: inline-block;
      min-width: 100%;
    }

    button, input, select, textarea {
      line-height: inherit;
      font: inherit;
      color: inherit;
    }

    img {
      border: 0;
      vertical-align: middle;
    }

    h1, h2, h3, h4, h5 {
      line-height: 1.1;
    }

    table {
      border-spacing: 0;
      border-collapse: collapse;
    }

    .full-width-heading {
      width: 100%;
      background-color: #186064;
    }

    .heading {
      max-width: 2560px;
      margin: 0;
      padding: 32px 24px;
      color: white;
      background: linear-gradient(to bottom right, #0C4348, #317178, #5F8C8C);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .heading-text {
      flex: 1;
      min-width: 0;
    }

    .heading h1 {
      font-weight: normal;
      font-size: 35px;
      margin: 0 0 12px 0;
      padding: 0;
    }

    .heading h2 {
      font-weight: normal;
      font-size: 24px;
      color: #c0f0ff;
      margin: 0;
      padding: 0;
    }

    .target {
      font-style: italic;
      color: #9ff;
      padding-left: 4px;
    }

    .btn-catalog {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #e0f7fa;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }
    .btn-catalog:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
    }
    .btn-catalog:active {
      transform: scale(0.97);
    }
    .btn-catalog svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    img.grpc-logo {
      width: 100px;
      margin-bottom: 6px;
      margin-right: 8px;
      margin-top: 3px;
    }

    #grpc-form {
      margin: 0;
      padding: 24px;
    }
    </style>
    <script>
    // ZOMG this is awful. This beast comes from https://developer.mozilla.org/en-US/docs/Web/API/document/cookie
    var cookieValue = document.cookie.replace(/(?:(?:^|.*;\s*)_grpcui_csrf_token\s*\=\s*([^;]*).*$)|^.*$/, "$1");
    // add CSRF token to all non-GET requests
    $(document).ajaxSend(function(event, request, settings) {
        if (settings.method !== "GET") {
            request.setRequestHeader("x-grpcui-csrf-token", cookieValue);
        }
    });
    </script>
    {{ range .AddlResources }}
      {{ . }}
    {{ end }}
  </head>
  <body>
    <div class="full-width-heading">
      <div class="heading">
        <div class="heading-text">
          <h1>
            {{ if not (eq .PageTitle "") }}
              {{ .PageTitle }} GRPC Console
            {{ else }}
              <img class="grpc-logo" src="grpc-logo.png" alt="GRPC"/> Web UI
            {{ end }}
          </h1>
          <!-- {{ if not (eq .Target "") }}
            <h2>Connected to <span class="target">{{ .Target }}</span></h2>
          {{ end }} -->
        </div>
        {{ if not (eq .CatalogURL "") }}
          <a class="btn-catalog" href="{{ .CatalogURL }}" id="btn-back-to-catalog">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Back to Catalog
          </a>
        {{ end }}
      </div>
    </div>
    {{.WebFormContents}}
  </body>
</html>
